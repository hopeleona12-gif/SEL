<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Eye Tracking Debug</title><style>body{font-family:Arial;margin:20px;color:#243b36}.aoi{position:absolute;padding:25px;background:#dcefe8;border:2px solid #3d9f83}.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#e96f51;transform:translate(-50%,-50%)}button{margin:8px;padding:8px 14px}#stage{height:55vh;position:relative;border:1px solid #aaa}</style><script src="https://webgazer.cs.brown.edu/webgazer.js"></script><script src="eye-tracking.js"></script><h2>Eye Tracking Debug</h2><p>calibration_status: <b id="calibration">—</b> | gaze: <b id="gaze">—</b> | AOI: <b id="aoi">—</b> | samples: <b id="samples">0</b> | IndexedDB saved: <b id="saved">no</b></p><button onclick="start()">Start</button><button onclick="stop()">Stop & Save</button><button onclick="EyeTracking.exportJson()">Export JSON</button><div id="stage"><div class="aoi" data-gaze-aoi="missing_part" style="left:8%;top:15%">missing_part</div><div class="aoi" data-gaze-aoi="windmill" style="left:38%;top:35%">windmill</div><div class="aoi" data-gaze-aoi="material_area" style="left:68%;top:55%">material_area</div></div><script>let timer;async function boot(){await EyeTracking.init({taskId:'DEBUG'});setInterval(()=>{const s=EyeTracking.status();calibration.textContent=s.calibrationStatus;gaze.textContent=s.currentGaze?`${Math.round(s.currentGaze.x)}, ${Math.round(s.currentGaze.y)}`:'—';aoi.textContent=s.currentAOI||'other';samples.textContent=s.sampleCount;saved.textContent=s.savedIndexedDB?'yes':'no'},300)}function start(){EyeTracking.startWindow({taskId:'DEBUG',sceneId:'demo'});timer=setInterval(()=>{const p=webgazer.getCurrentPrediction?.();if(p?.x){const d=document.createElement('i');d.className='dot';d.style.left=p.x+'px';d.style.top=p.y+'px';document.body.appendChild(d)}},100)}async function stop(){clearInterval(timer);await EyeTracking.stopWindow()}boot().catch(e=>alert(e.message))</script></html>
