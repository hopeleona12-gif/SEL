<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>眼动校准</title><style>body{margin:0;background:#f3f6f5;color:#243b36;font-family:"Microsoft YaHei",sans-serif;text-align:center}.top{height:76px;padding:12px;box-sizing:border-box;display:flex;gap:14px;align-items:center;justify-content:center}#grid{position:fixed;inset:76px 30px 30px}.dot{position:absolute;width:28px;height:28px;border:4px solid #fff;border-radius:50%;background:#e96f51;box-shadow:0 0 0 2px #e96f51;transform:translate(-50%,-50%);cursor:pointer}.dot.done{background:#3d9f83}button{padding:10px 18px;border:0;border-radius:20px;background:#3d9f83;color:#fff;font-size:16px}#skip{background:#6b7773}</style></head><body><div class="top"><b>摄像头授权与 9 点校准</b><span id="status">正在初始化…</span><button id="skip" type="button">跳过眼动并继续</button></div><div id="grid"></div><script src="https://webgazer.cs.brown.edu/webgazer.js"></script><script src="eye-tracking.js"></script><script>
(()=>{const status=document.querySelector('#status'),grid=document.querySelector('#grid'),next=()=>location.href=new URLSearchParams(location.search).get('return')||'../index.html';document.querySelector('#skip').onclick=()=>{EyeTracking.setCalibrationStatus('skipped');next()};(async()=>{const points=[[10,10],[50,10],[90,10],[10,50],[50,50],[90,50],[10,90],[50,90],[90,90]];EyeTracking.setCalibrationStatus('authorizing');try{await EyeTracking.init({taskId:'MASTER'});EyeTracking.setCalibrationStatus('calibrating');status.textContent='请依次点击每个红点 5 次，并持续注视红点';let completed=0;points.forEach(([x,y])=>{const b=document.createElement('button');b.className='dot';b.style.left=x+'%';b.style.top=y+'%';let clicks=0;b.onclick=()=>{if(++clicks<5)return;b.classList.add('done');b.disabled=true;if(++completed===9){EyeTracking.setCalibrationStatus('success');status.textContent='校准成功，正在进入测评';setTimeout(next,600)}};grid.appendChild(b)})}catch(error){EyeTracking.setCalibrationStatus('failed');status.textContent='眼动初始化失败，可重试页面或跳过继续测评'}})()})();
</script></body></html>
