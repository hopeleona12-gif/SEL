<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>T01</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfece8;font-family:"Microsoft YaHei",sans-serif}#app{position:fixed;inset:0;overflow:hidden;background:#dfece8}#app>.visual{position:absolute;inset:0;opacity:0;transition:opacity .42s ease;z-index:1}#app>.visual.active{opacity:1;z-index:2}video,.frame{width:100%;height:100%;object-fit:contain;background:#dfece8}.cards{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:min(1.2vw,1.8vh);padding:min(2.2vw,3.2vh);background:#dfece8}.cards.reason{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));column-gap:min(2vw,3.2vh);row-gap:min(2.4vw,3.8vh);padding:min(3.8vw,5.8vh) min(5.5vw,8.5vh)}.card{min-width:0;min-height:0;border:0;padding:0 0 min(.55vw,.8vh);background:#fff7ec;border-radius:min(1.2vw,2vh);overflow:hidden;transform:scale(1);transition:transform .18s,box-shadow .18s;display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:stretch}.card img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}.label{font-size:clamp(15px,min(1.45vw,2.4vh),26px);font-weight:700;color:#4c403b;line-height:1.15;min-height:2.1em;padding:.25em .3em .4em;text-align:center;display:grid;place-items:center}.reason .label{font-size:clamp(14px,min(1.3vw,2.15vh),23px);min-height:2em}.card.reading{transform:scale(1.025);box-shadow:0 0 0 min(.3vw,.5vh) #f2a65a,0 min(.8vw,1.2vh) min(1.6vw,2.4vh) #39534b55;z-index:2}.gate{position:fixed;inset:0;border:0;background:transparent;cursor:pointer;z-index:10}.response{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);display:flex;align-items:center;gap:1vw;padding:1vw 1.4vw;border-radius:999px;background:#fff;box-shadow:0 .7vw 2vw #263f3850;z-index:5}.speak{border:0;border-radius:999px;background:#e96f51;color:#fff;font-size:clamp(18px,1.8vw,30px);font-weight:700;padding:.75em 1.4em;cursor:pointer}.status{min-width:8em;font-size:clamp(16px,1.45vw,24px);font-weight:700;color:#4c403b}.response.listening .speak{background:#3d9f83;animation:pulse 1s infinite}.response.received .speak{background:#668c82}.answer-memory{position:absolute;right:3%;top:3%;z-index:6;max-width:22%;padding:.7vw;background:#fff;border-radius:1vw;box-shadow:0 .5vw 1.5vw #263f3840;text-align:center;color:#4c403b;font-size:clamp(14px,1.3vw,22px);font-weight:700}.answer-memory img{display:block;width:100%;max-height:18vh;object-fit:contain;margin-bottom:.35em}@keyframes pulse{50%{transform:scale(1.05)}}
  .cards{overflow:visible}.card.reading{transform:scale(1.08);z-index:20;position:relative}.card{overflow:visible}
  </style>
</head>
<body><main id="app"></main><button id="gate" class="gate" aria-label="开始"></button>
<script src="../T02/shared/voice-client.js"></script><script>
(()=>{
  const app=document.querySelector('#app'),gate=document.querySelector('#gate'),A='./assets/';
  const q=new URLSearchParams(location.search),part=(q.get('part')||q.get('demo')||'A').toUpperCase()==='B'?'B':'A';
  const emotion=[['happy','开心'],['sad','难过'],['angry','生气'],['worried','紧张/担心'],['calm','平静/还好'],['no_feeling','没什么感觉'],['unknown','不知道'],['other','其他']];
  const cause=[['task_event','刚才任务发生的事'],['other_people','别人说/做的事'],['task_difficulty','任务太难/太容易'],['sensory_uncomfortable','声音或画面不舒服'],['thought_other','想到别的事情'],['unknown_other','不知道/其他']];
  const blank=()=>({response_type:'',channel:'',raw_response:'',asr_text:'',asr_provider:'browser_prototype',asr_status:'not_started',aac_choice:'',prompt_level:'P0',score:null,score_status:'pending_review',validity:'pending',invalid_reason:'',question_shown_at:'',answer_started_at:'',answer_ended_at:'',latency_ms:null,response_duration_ms:null,audio_evidence_id:'',audio_mime_type:'',audio_size_bytes:0,sound_detected:false,support_card_used:false,cause_link:'',events:[]});
  const data={task:'T01',part,participant_id:'',assessment_session_id:'',source_task:part==='A'?'T04':'T08',source_record_id:'',source_score_locked:false,emotion:blank(),cause:blank(),timestamp:'',version:'prototype-2026-08-11'};
  window.addEventListener('message',e=>{if(e.data?.type!=='MASTER_SESSION_INIT')return;data.participant_id=e.data.participant?.child_id||e.data.participant?.id||'';data.assessment_session_id=e.data.assessment_session_id||e.data.session_id||''});
  let activeAudio=null,stream=null,recorder=null,chunks=[];
  const media=n=>A+n;
  function mount(el){el.classList.add('visual');app.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('active');[...app.querySelectorAll('.visual')].filter(x=>x!==el).forEach(x=>{x.classList.remove('active');setTimeout(()=>x.remove(),460)})}));return el}
  function still(name){const img=document.createElement('img');img.className='frame';img.alt='';img.onload=()=>mount(img);img.src=media(name)}
  function audio(name){return new Promise(resolve=>{activeAudio=new Audio(media(name));activeAudio.onended=resolve;activeAudio.onerror=resolve;activeAudio.play().catch(resolve)})}
  function video(name){return new Promise(resolve=>{const v=document.createElement('video');v.playsInline=true;v.muted=false;v.volume=1;v.src=media(name);v.preload='auto';v.oncanplay=()=>{if(!v.classList.contains('visual'))mount(v);v.play().catch(resolve)};v.onended=resolve;v.onerror=resolve;v.load()})}
  function saveAudio(blob,id){return new Promise((resolve,reject)=>{const req=indexedDB.open('sel-t01-evidence',1);req.onupgradeneeded=()=>req.result.createObjectStore('audio');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const tx=req.result.transaction('audio','readwrite');tx.objectStore('audio').put(blob,id);tx.oncomplete=()=>resolve(id);tx.onerror=()=>reject(tx.error)}})}
  function showEmotionMemory(){document.querySelectorAll('.answer-memory').forEach(x=>x.remove());const x=data.emotion,box=document.createElement('div');box.className='answer-memory';if(x.aac_choice){const item=emotion.find(v=>v[0]===x.aac_choice);box.innerHTML=`<img src="${media('T01_A05_state_'+x.aac_choice+'.PNG')}" alt=""><span>${item?item[1]:x.aac_choice}</span>`}else if(x.raw_response){box.textContent=x.raw_response}else{return}app.appendChild(box)}
  async function capture(kind,level){const target=data[kind];target.prompt_level=level;target.question_shown_at=new Date().toISOString();target.events.push({type:'question_shown',at:target.question_shown_at,prompt_level:level});let transcript='',soundDetected=false,audioBlob=null;const panel=document.createElement('div');panel.className='response';panel.innerHTML='<button class="speak">开始回答</button><span class="status">准备好后请按按钮</span>';app.appendChild(panel);const started=await Promise.race([new Promise(resolve=>panel.querySelector('.speak').onclick=()=>resolve(true)),new Promise(resolve=>setTimeout(()=>resolve(false),15000))]);if(!started){panel.querySelector('.status').textContent='暂时没有收到回答';target.events.push({type:'start_timeout',at:new Date().toISOString(),wait_ms:15000});await new Promise(r=>setTimeout(r,900));panel.remove();return false}target.answer_started_at=new Date().toISOString();target.latency_ms=Date.now()-Date.parse(target.question_shown_at);target.events.push({type:'recording_started',at:target.answer_started_at});panel.classList.add('listening');panel.querySelector('.speak').textContent='结束回答';panel.querySelector('.status').textContent='正在听，现在可以说话';let stopClicked=new Promise(resolve=>panel.querySelector('.speak').onclick=()=>resolve('manual'));let analyserTimer=null,audioContext=null;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start();audioContext=new AudioContext();const source=audioContext.createMediaStreamSource(stream),analyser=audioContext.createAnalyser();analyser.fftSize=512;source.connect(analyser);const buf=new Uint8Array(analyser.fftSize);analyserTimer=setInterval(()=>{analyser.getByteTimeDomainData(buf);let sum=0;for(const n of buf){const v=(n-128)/128;sum+=v*v}if(Math.sqrt(sum/buf.length)>.025)soundDetected=true},100)}catch(e){target.asr_status='microphone_error';target.validity='INV';target.invalid_reason='microphone_unavailable';panel.querySelector('.status').textContent='麦克风未开启'}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let sr=null;if(SR){try{sr=new SR();sr.lang='zh-CN';sr.interimResults=false;sr.onresult=e=>transcript=[...e.results].map(r=>r[0].transcript).join('');sr.onerror=()=>target.asr_status='error';sr.start();target.asr_status='listening'}catch(e){target.asr_status='unsupported'}}else target.asr_status='unsupported';await Promise.race([stopClicked,new Promise(r=>setTimeout(()=>r('max_duration'),20000))]);try{sr&&sr.stop()}catch(e){};if(analyserTimer)clearInterval(analyserTimer);if(audioContext)audioContext.close();if(recorder&&recorder.state==='recording'){await new Promise(resolve=>{recorder.onstop=resolve;recorder.stop()})}if(stream)stream.getTracks().forEach(t=>t.stop());audioBlob=chunks.length?new Blob(chunks,{type:recorder?.mimeType||'audio/webm'}):null;target.answer_ended_at=new Date().toISOString();target.response_duration_ms=Date.parse(target.answer_ended_at)-Date.parse(target.answer_started_at);target.asr_text=transcript;target.raw_response=transcript;target.sound_detected=soundDetected;target.asr_status=transcript.trim()?'success':target.asr_status==='listening'?'no_text':target.asr_status;if(audioBlob){const id=`${data.assessment_session_id||'local'}-${part}-${kind}-${Date.now()}`;try{await saveAudio(audioBlob,id);target.audio_evidence_id=id}catch(e){target.events.push({type:'audio_save_error',message:String(e)})}target.audio_mime_type=audioBlob.type;target.audio_size_bytes=audioBlob.size}panel.classList.remove('listening');panel.classList.add('received');panel.querySelector('.speak').textContent='回答结束';const hasResponse=soundDetected||transcript.trim();panel.querySelector('.status').textContent=hasResponse?'已收到你的回答':'没有检测到清楚的语音';if(hasResponse){target.response_type='voice';target.channel='voice';target.validity='pending_review';target.score=null;target.score_status='pending_aliyun_semantic_scoring';await new Promise(r=>setTimeout(r,700));panel.remove();return true}if(target.validity!=='INV'){target.validity='no_response';target.score_status='not_scored'}await new Promise(r=>setTimeout(r,900));panel.remove();return false}
  async function cards(kind){const list=kind==='emotion'?emotion:cause,prefix=kind==='emotion'?'T01_A05_state_':'T01_A08_reason_',audioPrefix=kind==='emotion'?'T01_A05_option_':'T01_A08_option_';const panel=document.createElement('div');panel.className=`cards ${kind==='cause'?'reason':''}`;panel.innerHTML=list.map(([id,label])=>`<button class="card" data-id="${id}"><img src="${media(prefix+id+'.PNG')}" alt="${label}"><span class="label">${label}</span></button>`).join('');mount(panel);await new Promise(r=>setTimeout(r,460));const els=[...panel.querySelectorAll('.card')];for(let i=0;i<els.length;i++){els[i].classList.add('reading');await audio(audioPrefix+els[i].dataset.id+'.mp3');els[i].classList.remove('reading')}
    return new Promise(resolve=>els.forEach(el=>el.onclick=()=>{const id=el.dataset.id,x=data[kind];x.response_type='aac';x.channel='aac_card';x.aac_choice=id;x.raw_response=el.innerText.trim();x.prompt_level='P2';x.support_card_used=true;x.validity='valid';x.score=kind==='emotion'?1:(id.includes('unknown')?0:1);x.score_status='scored_by_rule';x.answer_ended_at=new Date().toISOString();x.events.push({type:'card_selected',id,at:x.answer_ended_at});resolve()}))}
  async function emotionA(){await video('T01_A02_self_feeling_transition.mp4');await video('T01_A03_feeling_question.mp4');still('T01_A03_feeling_question_end.png');if(await capture('emotion','P0'))return;await video('T01_A04_event_replay.mp4');await audio('T01_A04_feeling_question_repeat.mp3');still('T01_A04_event_replay_end.png');if(await capture('emotion','P1'))return;await cards('emotion')}
  async function causeA(){await video('T01_A06_reason_question.mp4');still('T01_A06_reason_question_end.png');setTimeout(showEmotionMemory,120);if(await capture('cause','P0'))return;await video('T01_A07_reason_event_replay.mp4');await audio('T01_A07_reason_question_repeat.mp3');still('T01_A07_reason_event_replay_end.png');setTimeout(showEmotionMemory,120);if(await capture('cause','P1'))return;await cards('cause')}
  async function emotionB(){await video('T01_B02_emotion_question.mp4');still('T01_B02_emotion_question_end.png');if(await capture('emotion','P0'))return;await cards('emotion')}
  async function causeB(){await video('T01_B03_cause_question.mp4');still('T01_B03_cause_question_end.png');await capture('cause','P0')}
  async function finish(){data.timestamp=new Date().toISOString();const key='sel.t01.records',records=JSON.parse(localStorage.getItem(key)||'[]');records.push(data);localStorage.setItem(key,JSON.stringify(records));window.parent.postMessage({type:'SEL_T01_COMPLETE',payload:data},'*');if(part==='A'){await audio('T01_common_acknowledge.mp3');window.parent.postMessage({type:'SEL_RETURN_TO_TASK',payload:data},'*')}else{await video('T01_B04_probe_close.mp4');window.parent.postMessage({type:'SEL_ASSESSMENT_COMPLETE',payload:data},'*')}}
  async function start(){gate.remove();if(part==='A'){await emotionA();await causeA()}else{await emotionB();await causeB()}await finish()}
  still(part==='A'?'T01_A02_self_feeling_transition_start.png':'起始帧.png');gate.onclick=start;
  window.SELT01={start:o=>{if(!o||!['T04','T08'].includes(o.afterTask)||o.scoreLocked!==true)throw Error('T01 requires locked T04/T08');location.search='?part='+(o.afterTask==='T04'?'A':'B')}};
})();
</script></body></html>
