<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T05 小伙伴心里怎么想</title>
<style>
:root{--ink:#26334a;--muted:#6f7a90;--teal:#3f918e;--line:#dce5e5;--shadow:0 18px 48px rgba(40,61,76,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(140deg,#edf8f5,#fff9e9);font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}button{font:inherit}.app{width:min(1240px,100%);margin:auto;padding:18px}.top{height:58px;display:flex;align-items:center;gap:14px}.brand{font-size:23px;font-weight:900}.sub{font-size:13px;color:var(--muted)}.progress{margin-left:auto;display:flex;gap:7px}.dot{width:10px;height:10px;border-radius:50%;background:#d9e3e5}.dot.on{background:var(--teal)}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:28px;background:#dce7e6;box-shadow:var(--shadow)}video,.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.start{position:absolute;inset:0;display:grid;place-items:end center;padding:7%;background:linear-gradient(180deg,transparent 62%,rgba(16,27,39,.32));border:0;width:100%;cursor:pointer}.start span{border:0;border-radius:999px;background:var(--teal);color:#fff;padding:15px 34px;font-size:19px;font-weight:900;box-shadow:0 10px 28px rgba(25,79,76,.32)}.question{position:absolute;left:4%;right:4%;top:3%;display:flex;justify-content:center;pointer-events:none}.bubble{background:rgba(255,255,255,.95);border:2px solid #fff;border-radius:23px;padding:12px 25px;box-shadow:0 10px 28px rgba(20,38,50,.14);font-size:clamp(18px,2.1vw,29px);font-weight:900}.hotspot{position:absolute;border:3px solid transparent;background:transparent;border-radius:24px;cursor:pointer;transition:transform .22s ease,filter .22s ease,border-color .22s ease;transform-origin:center}.hotspot:focus-visible{border-color:#263b52;outline:4px solid #fff}.hotspot.reading{transform:scale(1.1);filter:drop-shadow(0 12px 14px rgba(34,52,64,.25));border-color:rgba(255,255,255,.95);z-index:3}.unknown{position:absolute;right:2.2%;bottom:2.4%;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.94);color:var(--ink);padding:11px 18px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(39,55,70,.12)}.waiting{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:9px 16px;color:var(--muted);font-size:13px;pointer-events:none}.fac{position:fixed;right:12px;top:12px;z-index:10}.fac>button{border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:12px;padding:8px 11px;color:var(--muted)}.panel{display:none;margin-top:7px;background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow);width:210px}.panel.show{display:block}.panel label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.panel select,.panel input{width:100%;padding:8px;margin-bottom:9px;border:1px solid var(--line);border-radius:8px}.end{position:absolute;inset:0;background:rgba(255,255,255,.96);display:grid;place-items:center;text-align:center;padding:35px}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.result{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fafdfc}.result strong{font-size:30px;display:block}.primary,.secondary{border-radius:999px;padding:13px 22px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--teal);color:#fff}.secondary{border:1px solid var(--line);background:#fff}@media(max-width:720px){.app{padding:7px}.top{height:52px;padding:3px}.sub{display:none}.stage{border-radius:17px}.bubble{padding:8px 13px}.unknown{padding:8px 12px}.results{grid-template-columns:1fr}}
.fitbox{position:absolute;height:100%;aspect-ratio:4/3;left:50%;top:0;transform:translateX(-50%)}.fitbox .still{object-fit:contain}.fitbox .hotspot.reading{transform:scale(1.05)}.waiting+.unknown{display:none}.home-originals{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:4.5%;background:#f7f3e8}.home-card{position:relative;overflow:hidden;border-radius:24px;border:5px solid rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(48,62,72,.15)}.home-card img{width:100%;height:100%;object-fit:cover}.home-card.a img{object-position:54% 38%}.home-card.b img{object-position:50% 50%}.home-card strong{position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.94);border-radius:999px;padding:11px 26px;font-size:clamp(18px,2vw,28px);white-space:nowrap}.home-copy{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:4;background:rgba(255,255,255,.96);padding:12px 28px;border-radius:22px;font-size:clamp(17px,1.7vw,24px);font-weight:900;white-space:nowrap}.home-originals+.start{z-index:5}
.stage>.unknown:last-child{display:block}.home-card{background:#eeeadd}.home-card img{object-fit:contain!important;object-position:center!important}.waiting{left:2.2%;top:2.4%;bottom:auto;transform:none}.fitbox~.waiting{display:none}.unknown{top:2.4%;bottom:auto}.fitbox>.unknown{display:none}
</style></head><body>
<main class="app"><header class="top"><div><div class="brand">T05 · 小伙伴心里怎么想</div><div class="sub">社会意识｜他人情绪—原因理解与观点采择</div></div></header><section class="stage" id="stage" aria-live="polite"></section></main>
<aside class="fac"><button id="facBtn">施测控制</button><div class="panel" id="facPanel"><label>参与者编号</label><input id="pid" value="DEMO-001"><label>当前支持等级</label><select id="hint"><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select><label><input type="checkbox" id="manualInv" style="width:auto"> 本题通道/施测无效</label></div></aside>
<script>
const A='assets/';
const steps=[
 {id:'intro',type:'intro',video:'intro.mp4',audio:'intro.mp3'},
 {id:'t05a_story',type:'auto',sub:'T05A',video:'t05a-story.mp4',audio:'t05a-story.mp3'},
 {id:'emotion',type:'qvideo',sub:'T05A',q:'小兔现在最可能是什么感觉？',video:'t05a-emotion.mp4',audio:'t05a-emotion.mp3',poster:'t05a-emotion.png',opts:['开心','难过','生气','害怕','平静'],correct:['难过','伤心','失落'],spots:[[5.7,63,15.7,34],[23.5,63,15.7,34],[41.4,63,15.7,34],[59.5,63,15.7,34],[77.2,63,15.7,34]]},
 {id:'cause',type:'qvideo',sub:'T05A',q:'什么让小兔有这种感觉？',video:'t05a-cause.mp4',audio:'t05a-cause.mp3',poster:'t05a-cause.png',opts:['气球飞走','气球颜色漂亮','小猴走过','天空有云'],correct:['气球飞走','喜欢的气球飞走了'],spots:[[4,58,21,38],[27,58,21,38],[52,58,21,38],[76,58,20,38]]},
 {id:'t05a_end',type:'auto',sub:'T05A',video:'t05a-end.mp4',audio:'t05a-end.mp3'},
 {id:'t05b_story',type:'auto',sub:'T05B',video:'t05b-story.mp4',audio:'t05b-story.mp3'},
 {id:'belief_location',type:'qvideo',sub:'T05B',q:'小熊会先去哪里找贴纸？',video:'t05b-location.mp4',audio:'t05b-location.mp3',poster:'t05b-location.png',opts:['蓝盒','黄盒'],correct:['蓝盒'],spots:[[15,46,28,47],[57,46,28,47]]},
 {id:'reason',type:'qstatic',sub:'T05B',q:'为什么小熊会先去那里找？',img:'t05b-reason.png',audio:'t05b-reason.mp3',fit:true,opts:['小熊没有看见贴纸被移动','贴纸现在在黄盒','小猴喜欢黄盒'],correct:['小熊没有看见贴纸被移动'],spots:[[1,1,98,33],[1,36,98,30],[1,68,98,30]]},
 {id:'memory_control',type:'qstatic',sub:'T05B',q:'小熊一开始把贴纸放在哪里？',img:'t05b-memory.png',audio:'t05b-memory.mp3',opts:['蓝盒','黄盒'],correct:['蓝盒'],control:true,spots:[[28,72,22,19],[55,72,22,19]]},
 {id:'reality_control',type:'qstatic',sub:'T05B',q:'贴纸现在真正在哪里？',img:'t05b-reality.png',audio:'t05b-reality.mp3',opts:['蓝盒','黄盒'],correct:['黄盒'],control:true,spots:[[27,68,21,18],[56,68,21,18]]},
 {id:'t05b_end',type:'auto',sub:'T05B',video:'t05b-end.mp4',audio:'t05b-end.mp3'}, {id:'end',type:'end'}];
let i=0,start=Date.now(),answered=false,highlightTimers=[];const records=[],$=s=>document.querySelector(s),stage=$('#stage');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clearTimers(){highlightTimers.forEach(clearTimeout);highlightTimers=[]}function progress(){}
function mediaMarkup(s,autoplay=true){if(s.type==='intro')return `<div class="home-originals"><div class="home-copy">看看小伙伴发生了什么，再想想它心里可能怎么想。</div><div class="home-card a"><img src="${A}t05a-emotion.png" alt="气球故事原图"><strong>气球故事</strong></div><div class="home-card b"><img src="${A}t05b-location.png" alt="盒子故事原图"><strong>盒子故事</strong></div></div><audio ${autoplay?'autoplay':''} preload="auto" src="${A+s.audio}"></audio>`;return `<video muted ${autoplay?'autoplay':''} playsinline preload="auto" ${s.poster?`poster="${A+s.poster}"`:''} src="${A+s.video}" aria-label="${esc(s.q||s.id)}"></video><audio ${autoplay?'autoplay':''} preload="auto" src="${A+s.audio}"></audio>`}
function syncPlay(){const v=stage.querySelector('video'),a=stage.querySelector('audio');if(v){v.currentTime=0;v.play().catch(()=>{})}if(a){a.currentTime=0;a.play().catch(()=>{})}}
function autoAdvance(){let done=false;const advance=()=>{if(done)return;done=true;i++;render()};const a=stage.querySelector('audio'),v=stage.querySelector('video');if(a)a.onended=advance;else if(v)v.onended=advance}
function hotspots(s){return s.spots.map((r,n)=>`<button class="hotspot" style="left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%" aria-label="${esc(s.opts[n])}" data-answer="${esc(s.opts[n])}"></button>`).join('')+`<button class="unknown" data-unknown>不知道</button>`}
function scheduleStaticHighlights(s,audio){const buttons=[...stage.querySelectorAll('.hotspot')];audio.onloadedmetadata=()=>{const lead=Math.min(3.2,audio.duration*.28),available=Math.max(1,audio.duration-lead),slot=available/buttons.length;buttons.forEach((b,n)=>{highlightTimers.push(setTimeout(()=>b.classList.add('reading'),(lead+n*slot)*1000));highlightTimers.push(setTimeout(()=>b.classList.remove('reading'),(lead+(n+.72)*slot)*1000))})}}
function render(){clearTimers();answered=false;start=Date.now();const s=steps[i];if(s.type==='intro'){stage.innerHTML=mediaMarkup(s,false)+`<button class="start" id="start"><span>开始任务</span></button>`;$('#start').onclick=()=>{stage.querySelector('.start').remove();syncPlay();autoAdvance()};return}if(s.type==='auto'){stage.innerHTML=mediaMarkup(s);syncPlay();autoAdvance();return}if(s.type==='qvideo'){stage.innerHTML=mediaMarkup(s)+`<div class="question"><div class="bubble">${esc(s.q)}</div></div>${hotspots(s)}<div class="waiting">请听完题目并选择图片</div>`;wireAnswers();syncPlay();const a=stage.querySelector('audio');a.onended=()=>stage.querySelector('.waiting')?.remove();return}if(s.type==='qstatic'){const media=`<img class="still" src="${A+s.img}" alt="${esc(s.q)}">${hotspots(s)}`;stage.innerHTML=`${s.fit?`<div class="fitbox">${media}</div>`:media}<audio autoplay preload="auto" src="${A+s.audio}"></audio><div class="waiting">请听完题目并选择图片</div>${s.fit?'<button class="unknown" data-unknown>不知道</button>':''}`;wireAnswers();const a=stage.querySelector('audio');scheduleStaticHighlights(s,a);a.onended=()=>stage.querySelector('.waiting')?.remove();a.play().catch(()=>{});return}finish()}
function wireAnswers(){stage.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer,'click'));stage.querySelector('[data-unknown]').onclick=()=>answer('不知道','unknown')}
function answer(value,channel){if(answered)return;answered=true;const s=steps[i],hint=$('#hint').value,correct=s.correct.includes(value),invalid=$('#manualInv').checked;const score=s.control?'':correct?(hint==='P0'||hint==='P1'?2:hint==='P2'?1:0):0;records.push({participant_id:$('#pid').value,task:'T05',subtask:s.sub,trial:s.id,question:s.id,answer:value,answer_channel:channel,reaction_time:Date.now()-start,hint_level:hint,score,validity:invalid?'INV':'valid',timestamp:new Date().toISOString()});clearTimers();stage.querySelectorAll('audio,video').forEach(m=>m.pause());setTimeout(()=>{i++;render()},260)}
function finish(){const get=id=>records.find(r=>r.question===id),emo=get('emotion'),cause=get('cause'),loc=get('belief_location'),reason=get('reason'),mem=get('memory_control'),real=get('reality_control');const invB=!mem||!real||mem.answer!=='蓝盒'||real.answer!=='黄盒'||[loc,reason,mem,real].some(x=>x?.validity==='INV');const a=emo&&cause?(Number(emo.score)+Number(cause.score))/2:null;let b=null;if(!invB&&loc&&reason){const lc=loc.answer==='蓝盒',rc=reason.answer==='小熊没有看见贴纸被移动',both=lc&&rc;b=both?(loc.hint_level==='P2'||reason.hint_level==='P2'?1:2):(lc!==rc?1:0)}const report={participant_id:$('#pid').value,task:'T05',T05A:{score:a,emotion:emo,cause},T05B:{score:b,validity:invB?'INV':'valid',belief_location:loc,reason,memory_control:mem?.answer||'',reality_control:real?.answer||''},combined_score:null,records};localStorage.setItem('T05_latest',JSON.stringify(report));stage.innerHTML=`<div class="end"><div><h1>这一关结束了</h1><p>回答已保存。数据已保存，不在儿童端显示计分。</p><button class="primary" id="download">下载 JSON 数据</button> <button class="secondary" id="restart">重新开始</button></div></div>`;$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=`T05_${report.participant_id}.json`;link.click();URL.revokeObjectURL(u)};$('#restart').onclick=()=>{records.length=0;i=0;render()}}
$('#facBtn').onclick=()=>$('#facPanel').classList.toggle('show');render();
</script><script src="eye-tracking-bridge.js"></script><script src="master-adapter.js"></script></body></html>
